[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-doppler-reconstruction"
version = "0.4.0"
description = "Experimental aircraft-acoustic observer localization using retarded-time physics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
geospatial = ["rasterio>=1.3", "pyproj>=3.6", "pyarrow>=12"]

[project.scripts]
aircraft-doppler = "aircraft_doppler.cli:main"

[tool.setuptools.packages.find]
include = ["aircraft_doppler*"]

[tool.setuptools.package-data]
aircraft_doppler = ["result_map.html"]
